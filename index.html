<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<title>ByteOST Homepage</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<style>
    body {
       background-image:url(https://file.garden/Z_Zkhskjxktxt43S/Byte%20Studios/OST/bg2.png);
       font-family:sans-serif;
    }
    
    .logos {
        margin-top:70px;
        margin-bottom:10px;
    }
    
    hr {
        border-color:white;
    }
    
    .center {
        text-align:center;
    }
    
    h1 {
        color:white;
    }

    }
    
    .collection {

        padding:10px;
        border-radius:15px;
        backdrop-filter: blur(3px);
    }
</style>

<div class="center">

<h1>Collections</h1>

<h2 style="margin-left:10px;">LEGACY</h2>
    <img src="https://file.garden/Z_Zkhskjxktxt43S/Byte%20Studios/OST/ALBUMPIC/BUZZ%20ZONE.png" class="song">
    <img src="https://file.garden/Z_Zkhskjxktxt43S/Byte%20Studios/OST/ALBUMPIC/SLOPPY.png" class="song">
